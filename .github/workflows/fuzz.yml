name: Fuzz

# Coverage-guided fuzzing of fuzz/fuzz_targets/*.rs. Nightly, not on every
# push: each target needs its own ASan-instrumented nightly build (slow —
# minutes, not seconds) and a real time budget to find anything, neither of
# which belongs blocking a PR. workflow_dispatch is there to run it on
# demand, e.g. after a change to the targets or the code they drive.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # New targets (crates/code normalisation, validate_uri, ...) join
        # this list as they're added — nothing else here needs to change.
        target: [escrow_state_machine]
    steps:
      - uses: actions/checkout@v4

      # fuzz/rust-toolchain.toml pins nightly (libFuzzer/ASan need it,
      # unlike the pinned-exact-version toolchain the contracts themselves
      # build with).
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
