[package]
name = "trustescrow-factory"
description = "TrustEscrow factory: deploys one escrow instance per trade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
trustescrow-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
trustescrow-types = { workspace = true, features = ["testutils"] }
# For signing real authorization entries in the multisig admin test — see
# the same note in contracts/escrow/Cargo.toml.
ed25519-dalek = "2"
rand = "0.8"

[features]
testutils = ["soroban-sdk/testutils", "trustescrow-types/testutils"]
